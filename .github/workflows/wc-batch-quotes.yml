name: Webclaw Batch Quotes

env:
  PROJECT_ID: my-project
  DATASET: analytics
  BUCKET_NAME: my-export-bucket
  CMD_SCRIPT_FOLDER: ./apps/wc-batch/docker

on:
  schedule:
    - cron: '30 8 * * *'
    - cron: '30 11 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  get_quotes:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout main repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Checkout webclaw repo
      # ---------------------------------------------------------
      - name: Checkout webclaw
        uses: actions/checkout@v4
        with:
          repository: 0xMassi/webclaw
          path: webclaw

      - name: Cache
        uses: actions/cache@v5.1.0
        with:
          path: |
            webclaw/.cargo
            webclaw/target
          key: ${{ runner.os }}-webclaw-${{ hashFiles('webclaw/Cargo.lock') }}
    
      # ---------------------------------------------------------
      # Verify ls
      # ---------------------------------------------------------
      - name: Verify ls
        run: |
          echo "pwd:$PWD"
          pwd
          ls -la
          echo '--- webclaw:'
          ls -la webclaw

      # ---------------------------------------------------------
      # Install Rust toolchain
      # ---------------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # ---------------------------------------------------------
      # Build webclaw CLI (now fast thanks to cache)
      # ---------------------------------------------------------
      - name: Build webclaw CLI
        run: |
          cd webclaw
          cargo build --release
          echo "$PWD/target/release" >> $GITHUB_PATH

      # ---------------------------------------------------------
      # Verify tools BEFORE touching GCP credentials
      # ---------------------------------------------------------
      - name: Verify ls 3
        run: |
          echo '--- webclaw:'
          ls -la webclaw
          echo '--- webclaw/target'
          ls -la webclaw/target
          echo '--- wc/.cargo'
          ls -la webclaw/.cargo
          webclaw https://digital-posture.com

      # ---------------------------------------------------------
      # Authenticate to Google Cloud (secure ordering)
      # ---------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/600125851897/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-actions@invcerts.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # ---------------------------------------------------------
      # Verify GCP tools
      # ---------------------------------------------------------
      - name: Verify GCP authentication
        run: |
          gcloud auth list
          gcloud config list

      # ---------------------------------------------------------
      # Execute webclaw workflows
      # ---------------------------------------------------------
      - name: Execute webclaw workflows
        working-directory: ${{ env.CMD_SCRIPT_FOLDER }}
        run: |
          chmod +x ./setup*.sh
          ./setup_local.sh
