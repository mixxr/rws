name: Webclaw Batch Quotes

env:
  PROJECT_ID: my-project
  DATASET: analytics
  BUCKET_NAME: gs://rws-data
  CMD_SCRIPT_FOLDER: ./apps/wc-batch/docker
  CMD2_SCRIPT_FOLDER: ./apps/f2/docker

on:
  schedule:
    - cron: '30 8 * * *'
    - cron: '30 11 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  get_quotes:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/0xmassi/webclaw:latest
    
    steps:
      # ---------------------------------------------------------
      # Checkout main repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Authenticate to Google Cloud (secure ordering)
      # ---------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/600125851897/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-actions@invcerts.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # ---------------------------------------------------------
      # Verify tools
      # ---------------------------------------------------------
      - name: Verify GCP authentication and tools
        run: |
          gcloud auth list
          gcloud config list
          webclaw --version

      # ---------------------------------------------------------
      # Execute webclaw workflows
      # ---------------------------------------------------------
      - name: Execute webclaw workflows
        working-directory: ${{ env.CMD_SCRIPT_FOLDER }}
        run: |
          chmod +x ./setup*.sh
          ./setup_local.sh

      - name: Upload quotes output
        uses: actions/upload-artifact@v4
        with:
          name: quotes-output
          path: ${{ env.CMD_SCRIPT_FOLDER }}/quotes/**

  extract_quotes:
    needs: get_quotes
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mixxr/format2:latest

    steps:
      - uses: actions/checkout@v4

      - name: Download quotes output
        uses: actions/download-artifact@v4
        with:
          name: quotes-output
          path: ${{ env.CMD2_SCRIPT_FOLDER }}/quotes

      - name: Process quotes
        working-directory: ${{ env.CMD2_SCRIPT_FOLDER }}
        run: |
          ls -R ./quotes
          chmod +x ./setup*.sh
          MOUNT_BUCKET=${{ env.BUCKET_NAME }} ./setup_all.sh
