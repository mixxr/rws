name: Refresh Certificate Status

env:
  PROJECT_ID: my-project
  DATASET: analytics
  BUCKET_NAME: my-export-bucket
  CMD_SCRIPT_FOLDER: ./apps/bq/wf-update
  CMD_RM_SCRIPT_FOLDER: ./apps/in/docker
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ITEM_NAME: details.csv
  TABLE_NAME: ISINs.staging_details
  COL_NAMES: isin issuer phase

on:
  schedule:
    - cron: '15 9 * * 1'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  data_retrieval:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout main repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Install Node.js (fast, secure)
      # ---------------------------------------------------------
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------------------------------------------------------
      # Verify tools
      # ---------------------------------------------------------
      - name: Verify tools
        run: |
          node -v
          npx wrangler -v

      # ---------------------------------------------------------
      # Execute item workflows
      # ---------------------------------------------------------
      - name: Download and refresh data from web
        working-directory: ${{ env.CMD_SCRIPT_FOLDER }}
        run: |
          chmod +x ./scripts/*.sh
          chmod +x ./run*.sh
          ./run_1.sh ${{ env.ITEM_NAME }} new_data.csv ${{ env.COL_NAMES }}
      
      - name: Upload new_data.csv output
        uses: actions/upload-artifact@v4
        with:
          name: new_data.csv
          path: ${{ env.CMD_SCRIPT_FOLDER }}/scripts/new_data.csv
          retention-days: 10
  
  update_bq:
    needs: data_retrieval
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout main repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Authenticate to Google Cloud (secure ordering)
      # ---------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/600125851897/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-actions@invcerts.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # ---------------------------------------------------------
      # Verify GCP tools
      # ---------------------------------------------------------
      - name: Verify GCP authentication
        run: |
          gcloud auth list
          gcloud config list
          bq version

      - name: Download quotes output
        uses: actions/download-artifact@v4
        with:
          name: new_data.csv
          path: ${{ env.CMD_SCRIPT_FOLDER }}/scripts
      
      # ---------------------------------------------------------
      # Execute item workflows
      # ---------------------------------------------------------
      - name: Prepare SQL and update BQ
        working-directory: ${{ env.CMD_SCRIPT_FOLDER }}
        run: |
          chmod +x ./scripts/*.sh
          chmod +x ./run*.sh
          ./run_2.sh ${{ env.TABLE_NAME }} new_data.csv

  rm_isins_from_quotes:
    needs: data_retrieval
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout main repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # ---------------------------------------------------------
      # Authenticate to Google Cloud (secure ordering)
      # ---------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/600125851897/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-actions@invcerts.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # ---------------------------------------------------------
      # Verify GCP tools
      # ---------------------------------------------------------
      - name: Verify GCP authentication
        run: |
          gcloud auth list
          gcloud config list

      - name: Download quotes output
        uses: actions/download-artifact@v4
        with:
          name: new_data.csv
          path: ${{ env.CMD_RM_SCRIPT_FOLDER }}/helpers
      
      # ---------------------------------------------------------
      # Execute item workflows and send email
      # ---------------------------------------------------------
      - name: Remove ISINs from quotes
        working-directory: ${{ env.CMD_RM_SCRIPT_FOLDER }}
        run: |
          chmod +x ./helpers/*.sh
          chmod +x ./*.sh
          ./remove_isins_main.sh new_data.csv
      
      - name: Load file content
        working-directory: ${{ env.CMD_RM_SCRIPT_FOLDER }}/helpers
        run: |
          {
            echo "MAIL_BODY<<EOF"
            echo '<table border="1" cellpadding="6" cellspacing="0">'
            echo '<tr><th>ISIN</th><th>Issuer</th><th>Phase</th></tr>'
            tail -n +2 new_data.csv \
              | awk -F';' '{ printf "<tr><td>%s</td><td>%s</td><td>%s</td></tr>\n", $1, $2, $3 }'
            echo '</table>'
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "${{ github.workflow }}"
          to: ${{ secrets.SMTP_USER_TO }}
          from: ${{ secrets.SMTP_USER }}
          html_body: <h2 style="color:#2a7ae2;">Check latest status</h2>
            <p style="font-size:12px;color:#666;">${{ env.MAIL_BODY }}</p>