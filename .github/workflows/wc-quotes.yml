name: Webclaw Quotes

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout main repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Checkout webclaw repo
      # ---------------------------------------------------------
      - name: Checkout webclaw
        uses: actions/checkout@v4
        with:
          repository: 0xMassi/webclaw
          path: webclaw

      - name: Cache
        uses: actions/cache@v5.1.0
        with:
          path: |
            webclaw/.cargo
            webclaw/target
          key: ${{ runner.os }}-webclaw-${{ hashFiles('webclaw/Cargo.lock') }}
    
      # ---------------------------------------------------------
      # Verify ls
      # ---------------------------------------------------------
      - name: Verify ls
        run: |
          echo 'pwd:${PWD}'
          ls -la
          echo '--- webclaw:'
          ls -la webclaw

      # ---------------------------------------------------------
      # Install Rust toolchain
      # ---------------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # ---------------------------------------------------------
      # Verify ls
      # ---------------------------------------------------------
      - name: Verify ls 2
        run: |
          ls -la
          echo '--- webclaw:'
          ls -la webclaw
          echo '--- webclaw/target'
          ls -la webclaw/target
          echo '--- wc/.cargo'
          ls -la webclaw/.cargo

      # ---------------------------------------------------------
      # Build webclaw CLI (now fast thanks to cache)
      # ---------------------------------------------------------
      - name: Build webclaw CLI
        run: |
          cd webclaw
          cargo build --release
          echo "$PWD/target/release" >> $GITHUB_PATH

      # ---------------------------------------------------------
      # Verify tools BEFORE touching GCP credentials
      # ---------------------------------------------------------
      - name: Verify ls 3
        run: |
          echo '--- webclaw:'
          ls -la webclaw
          echo '--- webclaw/target'
          ls -la webclaw/target
          echo '--- wc/.cargo'
          ls -la webclaw/.cargo
          webclaw https://digital-posture.com
