name: Webclaw Quotes

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout main repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Checkout webclaw repo
      # ---------------------------------------------------------
      - name: Checkout webclaw
        uses: actions/checkout@v4
        with:
          repository: 0xMassi/webclaw
          path: webclaw

      - name: Cache
        uses: actions/cache@v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/webclaw/target
          # An explicit key for restoring and saving the cache
          key: ${{ runner.os }}-webclaw-${{ hashFiles('~/webclaw/Cargo.toml') }}
    
      # ---------------------------------------------------------
      # Verify ls
      # ---------------------------------------------------------
      - name: Verify ls
        run: |
          ls -la
          echo '---'
          ls -la webclaw
          echo 'lock:'
          ls ~/webclaw/Cargo.lock
          echo '---'
          ls -la /
          echo '---'
          ls -la /.cargo

      # ---------------------------------------------------------
      # Install Rust toolchain
      # ---------------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # ---------------------------------------------------------
      # Verify ls
      # ---------------------------------------------------------
      - name: Verify ls 2
        run: |
          ls -la
          echo '---'
          ls -la webclaw
          echo '---'
          ls -la /
          echo '---'
          ls -la /.cargo

      # ---------------------------------------------------------
      # Build webclaw CLI (now fast thanks to cache)
      # ---------------------------------------------------------
      - name: Build webclaw CLI
        run: |
          cd webclaw
          cargo build --release
          echo "$PWD/target/release" >> $GITHUB_PATH

      # ---------------------------------------------------------
      # Verify tools BEFORE touching GCP credentials
      # ---------------------------------------------------------
      - name: Verify ls 3
        run: |
          ls -la
          echo '---'
          ls -la webclaw
          echo '---'
          ls -la /
          echo '---'
          ls -la /.cargo
