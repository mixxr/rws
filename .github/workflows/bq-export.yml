name: BigQuery Export

env:
  PROJECT_ID: my-project
  DATASET: analytics
  BUCKET_NAME: my-export-bucket
  CMD_SCRIPT_FOLDER: ./apps/bq/wf-consolidation

on:
  schedule:
    - cron: '30 8 * * *'   # 09:30 CET / 10:30 CEST
    - cron: '30 11 * * *'  # 12:30 CET / 13:30 CEST
    - cron: '0 16 * * *'   # 17:00 CET / 18:00 CEST

  # Consente l'avvio manuale
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/600125851897/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-actions@invcerts.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Install Node.js 22 (required for Wrangler)
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo bash -
          sudo apt-get install -y nodejs
          node -v
          npm -v
          npx -v

      - name: Verify authentication
        run: |
          gcloud auth list
          gcloud config list
          bq version
          npx wrangler -v

      - name: Execute item workflows
        working-directory: ${{ env.CMD_SCRIPT_FOLDER }} 
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        run: |
          chmod +x ./scripts/*.sh
          chmod +x ./export_all.sh
          ./export_all.sh 

