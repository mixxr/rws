name: BigQuery Export

env:
  PROJECT_ID: my-project
  DATASET: analytics
  BUCKET_NAME: my-export-bucket
  CMD_SCRIPT_FOLDER: ./apps/bq/wf-consolidation
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

on:
  schedule:
    - cron: '30 8 * * 1-5'
    - cron: '30 11 * * 1-5'
    - cron: '0 16 * * 1-5'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout main repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Install Node.js (fast, secure)
      # ---------------------------------------------------------
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------------------------------------------------------
      # Authenticate to Google Cloud (secure ordering)
      # ---------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/600125851897/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-actions@invcerts.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # ---------------------------------------------------------
      # Verify GCP tools
      # ---------------------------------------------------------
      - name: Verify GCP authentication
        run: |
          gcloud auth list
          gcloud config list
          bq version
          node -v
          npx wrangler -v

      # ---------------------------------------------------------
      # Execute item workflows
      # ---------------------------------------------------------
      - name: Execute item workflows
        working-directory: ${{ env.CMD_SCRIPT_FOLDER }}
        run: |
          chmod +x ./scripts/*.sh
          chmod +x ./export_all.sh
          ./export_all.sh
