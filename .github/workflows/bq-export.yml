name: BigQuery Export

env:
  PROJECT_ID: my-project
  DATASET: analytics
  BUCKET_NAME: my-export-bucket
  CMD_SCRIPT_FOLDER: ./apps/bq/wf-consolidation

on:
  schedule:
    # Ogni giorno alle 10:00 UTC
    - cron: '0 10 * * *'

  # Consente l'avvio manuale
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/600125851897/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-actions@invcerts.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify authentication
        run: |
          gcloud auth list
          gcloud config list
          bq version
          ls -la

      - name: Execute item workflows
        run: |
          chmod +x "$CMD_SCRIPT_FOLDER/scripts/*.sh"
          chmod +x "$CMD_SCRIPT_FOLDER/export_all.sh"
          "$CMD_SCRIPT_FOLDER/export_all.sh" 

