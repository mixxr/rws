name: Repo Summary with AI

on: 
  workflow_dispatch:
  schedule:
    - cron: '15 16 * * 1-5'

env:
  COMMIT_COUNT: 10

jobs:
  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50   # must be >= COMMIT_COUNT below

      - name: Gather recent repo changes
        id: gather
        run: |
          # Adjust COMMIT_COUNT above to change how many commits are considered
          LOG=$(git log -"${{env.COMMIT_COUNT}}" --pretty=format:"- %h %s (%an)")
          DIFF=$(git diff "HEAD~${{env.COMMIT_COUNT}}..HEAD" --stat)

          {
            echo "log<<EOF"
            echo "$LOG"
            echo "EOF"
            echo "diffstat<<EOF"
            echo "$DIFF"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run AI Inference via Groq
        id: inference
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COMMIT_LOG: ${{ steps.gather.outputs.log }}
          DIFF_STAT: ${{ steps.gather.outputs.diffstat }}
        run: |
          PROMPT=$(cat <<PROMPT_EOF
          Summarize the following recent changes to this repository in a few
          concise bullet points, aimed at someone who hasn't seen the code.

          Respond with a valid HTML fragment only — no markdown, no code fences,
          no <html>/<head>/<body> tags. Use a <ul> with <li> items, and wrap any
          file or function names in <code> tags. Do not include any commentary
          outside the HTML.

          Recent commits:
          ${COMMIT_LOG}

          Files changed:
          ${DIFF_STAT}
          PROMPT_EOF
          )

          payload=$(jq -n --arg prompt "$PROMPT" '{
            messages: [
              { role: "user", content: $prompt }
            ],
            model: "openai/gpt-oss-120b",
            temperature: 1,
            max_completion_tokens: 2048,
            top_p: 1,
            stream: false,
            reasoning_effort: "medium",
            stop: null
          }')

          response=$(curl -s "https://api.groq.com/openai/v1/chat/completions" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${GROQ_API_KEY}" \
            -d "$payload")

          content=$(echo "$response" | jq -r '.choices[0].message.content')

          if [ -z "$content" ] || [ "$content" == "null" ]; then
            echo "::error::Groq API call failed or returned no content"
            echo "$response"
            exit 1
          fi
          
          # Strip accidental ```html / ``` fences in case the model adds them anyway
          content=$(echo "$content" | sed -e '/^```html$/d' -e '/^```$/d')

          {
            echo "response<<EOF"
            echo "$content"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Print output
        run: echo "${{ steps.inference.outputs.response }}"

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "Repo Summary"
          to: ${{ secrets.SMTP_USER_TO }}
          from: ${{ secrets.SMTP_USER }}
          html_body: <h2 style="color:#2a7ae2;">Statistics</h2>
            <p>Summary of latest ${{env.COMMIT_COUNT}} commits</p>
            <p style="font-size:12px;color:#666;">${{ steps.inference.outputs.response }}</p>
