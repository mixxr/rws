name: SunBurst

env:
  PROJECT_ID: my-project
  DATASET: analytics
  BUCKET_NAME: my-export-bucket
  CMD_SCRIPT_FOLDER: ./apps/sb/wf
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

on:
  schedule:
    - cron: '45 8 * * *'
    - cron: '45 11 * * *'
    - cron: '15 16 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sectors_calculation:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout main repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Install Node.js (fast, secure)
      # ---------------------------------------------------------
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------------------------------------------------------
      # Verify tools
      # ---------------------------------------------------------
      - name: Verify tools
        run: |
          node -v
          npx wrangler -v

      # ---------------------------------------------------------
      # Execute item workflows
      # ---------------------------------------------------------
      - name: Download, file preparation
        working-directory: ${{ env.CMD_SCRIPT_FOLDER }}
        run: |
          chmod +x ./scripts/*.sh
          chmod +x ./run*.sh
          ./run_dwl.sh

      - name: Execute get quotes and consolidation
        working-directory: ${{ env.CMD_SCRIPT_FOLDER }}
        run: |
          chmod +x ./scripts/*.sh
          chmod +x ./run*.sh
          ./run.sh

      - name: Upload, cp to bucket
        working-directory: ${{ env.CMD_SCRIPT_FOLDER }}
        run: |
          chmod +x ./scripts/*.sh
          chmod +x ./run*.sh
          ./run_rclone_setup.sh
          ./run_upl.sh
        env:
          R2_CLONE_SECRET: ${{ secrets.R2_CLONE_SECRET }}
