name: App IN Runner

env:
  PROJECT_ID: my-project
  DATASET: analytics
  BUCKET_NAME: my-export-bucket
  CMD_SCRIPT_FOLDER: ./apps/in/docker

on:
  issues:
    types: [labeled]

  # Consente l'avvio manuale
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  export:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'enhancement'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/600125851897/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-actions@invcerts.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify authentication
        run: |
          gcloud auth list
          gcloud config list
          bq version

      - name: Parse commit message into env vars
        id: parsevars
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit message: $COMMIT_MSG"

          # Extract ISSUER
          ISSUER=$(echo "$COMMIT_MSG" | sed -n "s/.*ISSUER=\([^;]*\).*/\1/p")
          echo "ISSUER=$ISSUER" >> $GITHUB_ENV

          # Extract TYPE_LIST (handles quoted or unquoted)
          RAW_TYPE_LIST=$(echo "$COMMIT_MSG" | sed -n "s/.*TYPE_LIST=\([^;]*\).*/\1/p")
          TYPE_LIST=$(echo "$RAW_TYPE_LIST" | sed "s/^['\"]//; s/['\"]$//")
          echo "TYPE_LIST=$TYPE_LIST" >> $GITHUB_ENV

          # Extract ISIN_LIST (handles quoted or unquoted)
          ISIN_LIST=$(echo "$COMMIT_MSG" | sed -n "s/.*ISIN_LIST=\([^;]*\).*/\1/p")
          # ISIN_LIST=$(echo "$RAW_ISIN_LIST" | sed "s/^['\"]//; s/['\"]$//")
          echo "ISIN_LIST=\"$ISIN_LIST\"" >> $GITHUB_ENV

          echo "Parsed ISSUER=$ISSUER"
          echo "Parsed TYPE_LIST=$TYPE_LIST"
          echo "Parsed ISIN_LIST=$ISIN_LIST"

      - name: Execute item workflows
        working-directory: ${{ env.CMD_SCRIPT_FOLDER }} 
        run: |
          chmod +x ./*.sh
          SILENT_MODE=true ./setup.sh

